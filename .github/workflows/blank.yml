services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
    RAM_SIZE: "8G"
  CPU_CORES: "4"
  AUDIO: "Y"
  USERNAME: "the light"
  PASSWORD: "102978"
  LANGUAGE: "English"
  REGION: "en-US"
  KEYBOARD: "en-US"
  
      VERSION: "10"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
    restart: always
    stop_grace_period: 2m
